const ADMIN_USERNAME='admin',ADMIN_PASSWORD='123456';
let state={managers:[],vacancies:[],candidates:[],interviews:[],currentManagerId:null,currentPage:'dashboard',currentVacancyId:null,language:'ar',filters:{status:'all',vacancyId:'all',search:''},lastSaved:null};
const CANDIDATE_STATUSES=[{key:'new',label:'مرشح جديد',class:'b-new'},{key:'contacted',label:'تم التواصل',class:'b-contacted'},{key:'interview_scheduled',label:'تم تحديد مقابلة',class:'b-interview-scheduled'},{key:'interviewed',label:'تمت المقابلة',class:'b-interviewed'},{key:'evaluating',label:'تحت المراجعة',class:'b-evaluating'},{key:'final',label:'مرشح نهائي',class:'b-final'},{key:'accepted',label:'مقبول',class:'b-accepted'},{key:'rejected',label:'مرفوض',class:'b-rejected'},{key:'withdrawn',label:'انسحب',class:'b-withdrawn'}];
const VACANCY_STATUSES=[{key:'open',label:'مفتوح',class:'b-open'},{key:'hiring',label:'قيد التوظيف',class:'b-hiring'},{key:'filled',label:'تم التوظيف',class:'b-filled'},{key:'stopped',label:'متوقف',class:'b-stopped'}];
const INTERVIEW_TYPES=[{key:'google',label:'Google Meet',icon:'📹',class:'b-google'},{key:'office',label:'مقر العمل',icon:'🏢',class:'b-office'}];

let firebaseReady=false,dataListeners={};

async function initFirebase(){
  let attempts=0;
  while(!window.firebaseDB&&attempts<50){await new Promise(r=>setTimeout(r,100));attempts++;}
  if(!window.firebaseDB){showToast('خطأ Firebase','error');return;}
  firebaseReady=true;
  const s=document.getElementById('firebaseStatus');if(s)s.style.display='flex';
  setupListeners();
  await loadAll();
}

function setupListeners(){
  const db=window.firebaseDB;
  if(!dataListeners.m)dataListeners.m=window.firebaseOnValue(window.firebaseRef(db,'avnzor_managers'),s=>{const d=s.val();if(d){state.managers=Object.values(d);if(state.currentManagerId&&getCurrentManager())render();}});
  if(!dataListeners.v)dataListeners.v=window.firebaseOnValue(window.firebaseRef(db,'avnzor_vacancies'),s=>{const d=s.val();if(d){state.vacancies=Object.values(d);if(state.currentManagerId&&getCurrentManager())render();}});
  if(!dataListeners.c)dataListeners.c=window.firebaseOnValue(window.firebaseRef(db,'avnzor_candidates'),s=>{const d=s.val();if(d){state.candidates=Object.values(d);if(state.currentManagerId&&getCurrentManager())render();}});
  if(!dataListeners.i)dataListeners.i=window.firebaseOnValue(window.firebaseRef(db,'avnzor_interviews'),s=>{const d=s.val();if(d){state.interviews=Object.values(d);if(state.currentManagerId&&getCurrentManager())render();}});
}

async function loadAll(){
  try{
    const db=window.firebaseDB;
    const ms=await window.firebaseGet(window.firebaseRef(db,'avnzor_managers'));if(ms.val())state.managers=Object.values(ms.val());
    const vs=await window.firebaseGet(window.firebaseRef(db,'avnzor_vacancies'));if(vs.val())state.vacancies=Object.values(vs.val());
    const cs=await window.firebaseGet(window.firebaseRef(db,'avnzor_candidates'));if(cs.val())state.candidates=Object.values(cs.val());
    const is=await window.firebaseGet(window.firebaseRef(db,'avnzor_interviews'));if(is.val())state.interviews=Object.values(is.val());
    
    // تحميل CVs من المسار المنفصل
    console.log(' Loading CVs...');
    let loadedCount=0;
    for(const c of state.candidates){
      if(c.hasCV){
        try{
          const cvSnap=await window.firebaseGet(window.firebaseRef(db,`avnzor_cvs/${c.id}`));
          const cv=cvSnap.val();
          if(cv&&cv.data){c.cvData=cv.data;c.cvName=cv.name;c.cvType=cv.type;loadedCount++;}
        }catch(e){console.warn('⚠️ Failed to load CV for',c.name,e);}
      }
    }
    console.log(`✅ Loaded ${loadedCount} CVs from Firebase`);
    
    if(state.managers.length===0){
      state.managers=[{id:uid(),name:'مدير النظام',username:ADMIN_USERNAME,password:ADMIN_PASSWORD,role:'admin',permissions:{canViewAllVacancies:true,canAddVacancy:true,canViewCV:true,canAddCV:true,allowedVacancyIds:[]}}];
      await saveAll();
    }
  }catch(e){console.error(e);}
}

async function saveAll(){
  if(!firebaseReady)return;
  try{
    const db=window.firebaseDB;
    const m={},v={},c={},i={};
    state.managers.forEach(x=>m[x.id]=x);
    state.vacancies.forEach(x=>v[x.id]=x);
    state.candidates.forEach(x=>{const cp={...x};delete cp.cvData;c[x.id]=cp;});
    state.interviews.forEach(x=>i[x.id]=x);
    await window.firebaseSet(window.firebaseRef(db,'avnzor_managers'),m);
    await window.firebaseSet(window.firebaseRef(db,'avnzor_vacancies'),v);
    await window.firebaseSet(window.firebaseRef(db,'avnzor_candidates'),c);
    await window.firebaseSet(window.firebaseRef(db,'avnzor_interviews'),i);
    state.lastSaved=Date.now();
  }catch(e){console.error(e);}
}

async function saveCV(candidateId,cvData,cvName,cvType){
  if(!firebaseReady){console.error('Firebase not ready');return false;}
  try{
    const db=window.firebaseDB;
    const cvObj={data:cvData,name:cvName,type:cvType,uploadedAt:Date.now(),size:cvData.length};
    await window.firebaseSet(window.firebaseRef(db,`avnzor_cvs/${candidateId}`),cvObj);
    console.log('✅ CV saved for',candidateId);
    return true;
  }catch(e){console.error('❌ CV save failed:',e);return false;}
}

async function deleteCV(candidateId){
  if(!firebaseReady)return;
  try{await window.firebaseRemove(window.firebaseRef(db,`avnzor_cvs/${candidateId}`));}catch(e){}
}

async function updateCandidateOnly(c){
  if(!firebaseReady)return;
  try{
    const db=window.firebaseDB;
    const cp={...c};delete cp.cvData;
    await window.firebaseUpdate(window.firebaseRef(db,`avnzor_candidates/${c.id}`),cp);
  }catch(e){console.error(e);}
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function showToast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.classList.remove('show'),3000);}
function getStatus(key,list){return list.find(s=>s.key===key)||list[0];}
function badge(key,list){const s=getStatus(key,list);return `<span class="badge ${s.class}">${s.label}</span>`;}
function esc(s){if(s==null)return '';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(d){if(!d)return '—';try{return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'});}catch(e){return d;}}
function fmtDateTime(d){if(!d)return '—';try{return new Date(d).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return d;}}
function initials(name){if(!name)return '?';return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function getManager(id){return state.managers.find(m=>m.id===id;}
function getCurrentManager(){return getManager(state.currentManagerId);}
function isAdminAccount(m){return m&&m.username===ADMIN_USERNAME;}
function canViewVacancy(m,vid){if(!m)return false;if(isAdminAccount(m)||m.permissions.canViewAllVacancies)return true;return m.permissions.allowedVacancyIds&&m.permissions.allowedVacancyIds.includes(vid);}
function canAddVacancy(m){return m&&(isAdminAccount(m)||m.permissions.canAddVacancy);}
function canViewCV(m){return m&&(isAdminAccount(m)||m.permissions.canViewCV);}
function canAddCV(m){return m&&(isAdminAccount(m)||m.permissions.canAddCV);}
function getVisibleVacancies(m){if(!m)return [];let l=state.vacancies.filter(v=>!v.isDeleted);if(isAdminAccount(m)||m.permissions.canViewAllVacancies)return l;return l.filter(v=>m.permissions.allowedVacancyIds&&m.permissions.allowedVacancyIds.includes(v.id));}
function getVisibleCandidates(m){if(!m)return [];const ids=getVisibleVacancies(m).map(v=>v.id);return state.candidates.filter(c=>{if(ids.includes(c.vacancyId))return true;const v=state.vacancies.find(x=>x.id===c.vacancyId);return v&&v.isDeleted&&(isAdminAccount(m)||v.ownerId===m.id);});}
function saveSession(){if(state.currentManagerId)localStorage.setItem('avnzor_session',state.currentManagerId);}
function loadSession(){const s=localStorage.getItem('avnzor_session');if(s)state.currentManagerId=s;}
function clearSession(){localStorage.removeItem('avnzor_session');}

function handleLogin(e){e.preventDefault();const u=document.getElementById('loginUsername').value.trim().toLowerCase();const p=document.getElementById('loginPassword').value;const err=document.getElementById('loginError');const m=state.managers.find(x=>x.username&&x.username.toLowerCase()===u);if(m&&m.password===p){state.currentManagerId=m.id;saveSession();err.style.display='none';showApp();}else{err.style.display='block';}}
function logout(){if(!confirm('تسجيل الخروج؟'))return;state.currentManagerId=null;clearSession();document.getElementById('appContainer').classList.remove('active');document.getElementById('loginPage').style.display='flex';document.getElementById('loginForm').reset();}

function showApp(){
  if(!state.currentManagerId){document.getElementById('loginPage').style.display='flex';document.getElementById('appContainer').classList.remove('active');return;}
  document.getElementById('loginPage').style.display='none';document.getElementById('appContainer').classList.add('active');
  const m=getCurrentManager();
  if(m){document.getElementById('currentUserName').textContent=m.name;document.getElementById('currentUserRole').textContent=isAdminAccount(m)?'مدير النظام':(m.role||'مدير');document.getElementById('currentUserAvatar').textContent=initials(m.name);}
  const nav=document.getElementById('navMenu');const ex=nav.querySelector('a[data-page="settings"]');if(ex)ex.parentElement.remove();
  if(isAdminAccount(m)){const li=document.createElement('li');li.className='nav-item';li.innerHTML=`<a class="nav-link" data-page="settings"><span class="nav-icon">️</span><span>إدارة المستخدمين</span></a>`;nav.appendChild(li);li.querySelector('a').addEventListener('click',()=>{document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));li.querySelector('a').classList.add('active');state.currentPage='settings';render();});}
  render();
}

function showUserMenu(){const m=getCurrentManager();if(!m)return;const body=`<div style="text-align:center;padding:20px"><div class="user-avatar" style="width:70px;height:70px;font-size:24px;margin:0 auto 14px">${initials(m.name)}</div><div style="font-size:18px;font-weight:700;color:var(--primary)">${esc(m.name)}</div><div style="font-size:13px;color:var(--text-light);margin-top:4px">@${esc(m.username)}</div><hr style="margin:16px 0;border:none;border-top:1px solid var(--border)"><div style="text-align:right;font-size:13px"><div>📋 الشواغر: <strong>${getVisibleVacancies(m).length}</strong></div><div>👥 المرشحون: <strong>${getVisibleCandidates(m).length}</strong></div><div>📅 المقابلات: <strong>${state.interviews.filter(i=>getVisibleVacancies(m).map(v=>v.id).includes(i.vacancyId)).length}</strong></div><div> CVs: <strong>${getVisibleCandidates(m).filter(c=>c.cvData).length}</strong></div></div></div>`;openModal(' حسابي',body,`<button class="btn btn-danger btn-sm" onclick="closeModal();logout()">🚪 خروج</button><button class="btn btn-secondary" onclick="closeModal()">إغلاق</button>`);}

function openModal(title,body,footer='',large=false){document.getElementById('modalTitle').innerHTML=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFooter').innerHTML=footer;document.getElementById('modalBox').classList.toggle('lg',large);document.getElementById('modal').classList.add('active');}
function closeModal(){document.getElementById('modal').classList.remove('active');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.querySelectorAll('.nav-link').forEach(link=>{link.addEventListener('click',()=>{document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));link.classList.add('active');state.currentPage=link.dataset.page;state.currentVacancyId=null;render();});});
function navTo(page){state.currentPage=page;document.querySelectorAll('.nav-link').forEach(l=>l.classList.toggle('active',l.dataset.page===page));render();}
function openVacancy(id){state.currentPage='vacancy-detail';state.currentVacancyId=id;document.querySelectorAll('.nav-link').forEach(l=>l.classList.toggle('active',l.dataset.page==='vacancies'));render();}

function render(){const app=document.getElementById('app');window.scrollTo(0,0);const m=getCurrentManager();if(!m)return;switch(state.currentPage){case 'dashboard':app.innerHTML=renderDashboard(m);break;case 'vacancies':app.innerHTML=renderVacancies(m);break;case 'vacancy-detail':app.innerHTML=renderVacancyDetail(m);break;case 'candidates':app.innerHTML=renderCandidates(m);break;case 'interviews':app.innerHTML=renderInterviews(m);break;case 'archive':app.innerHTML=renderArchive(m);break;case 'cvrequest':app.innerHTML=renderCVRequest(m);break;case 'settings':app.innerHTML=renderSettings(m);break;}attachPageEvents();}

function renderDashboard(m){const vv=getVisibleVacancies(m),vc=getVisibleCandidates(m),ov=vv.filter(v=>v.status==='open').length,ac=vc.filter(c=>c.status==='accepted').length,rj=vc.filter(c=>c.status==='rejected').length,ui=state.interviews.filter(i=>new Date(i.date)>=new Date(new Date().toDateString())).length;return `<div class="page-header"><div><h1 class="page-title">مرحباً، ${esc(m.name)} 👋</h1><p class="page-subtitle">${new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p></div>${canAddVacancy(m)?`<button class="btn btn-primary" onclick="openVacancyForm()">➕ شاغر</button>`:''}</div><div class="stats-grid"><div class="stat-card"><div><div class="stat-label">شواغر مفتوحة</div><div class="stat-value">${ov}</div></div><div class="stat-icon"></div></div><div class="stat-card info"><div><div class="stat-label">مرشحون</div><div class="stat-value">${vc.length}</div></div><div class="stat-icon">👥</div></div><div class="stat-card accent"><div><div class="stat-label">مقابلات قادمة</div><div class="stat-value">${ui}</div></div><div class="stat-icon">📅</div></div><div class="stat-card success"><div><div class="stat-label">مقبولون</div><div class="stat-value">${ac}</div></div><div class="stat-icon">✅</div></div><div class="stat-card danger"><div><div class="stat-label">مرفوضون</div><div class="stat-value">${rj}</div></div><div class="stat-icon">❌</div></div></div><div class="card"><div class="card-header"><div class="card-title"> الشواغر</div></div>${vv.length===0?`<div class="empty-state"><div class="empty-state-title">لا توجد شواغر</div></div>`:`<div class="vacancies-grid">${vv.slice(0,6).map(v=>{const cs=state.candidates.filter(c=>c.vacancyId===v.id);return `<div class="vacancy-card" onclick="openVacancy('${v.id}')"><div class="flex-between mb-2"><div class="vacancy-title">${esc(v.title)}</div>${badge(v.status,VACANCY_STATUSES)}</div><div class="vacancy-meta-row"><span>🏢 ${esc(v.department||'—')}</span></div><div class="vacancy-stats"><div class="vacancy-stat"><div class="vacancy-stat-num">${cs.length}</div><div class="vacancy-stat-label">مرشح</div></div></div></div>`;}).join('')}</div>`}</div>`;}

function renderVacancies(m){let vv=getVisibleVacancies(m);if(state.filters.search){const q=state.filters.search.toLowerCase();vv=vv.filter(v=>(v.title||'').toLowerCase().includes(q));}return `<div class="page-header"><div><h1 class="page-title">الشواغر</h1><p class="page-subtitle">${vv.length} شاغر</p></div>${canAddVacancy(m)?`<button class="btn btn-primary" onclick="openVacancyForm()">➕ شاغر</button>`:''}</div><div class="card"><input type="text" class="form-control" id="vacancySearch" placeholder=" بحث..." value="${esc(state.filters.search)}" style="max-width:400px;margin-bottom:16px">${vv.length===0?`<div class="empty-state"><div class="empty-state-title">لا توجد شواغر</div></div>`:`<div class="vacancies-grid">${vv.map(v=>{const cs=state.candidates.filter(c=>c.vacancyId===v.id);const o=getManager(v.ownerId);return `<div class="vacancy-card" onclick="openVacancy('${v.id}')"><div class="flex-between mb-2"><div class="vacancy-title">${esc(v.title)}</div>${badge(v.status,VACANCY_STATUSES)}</div><div class="vacancy-meta-row"><span> ${esc(o?o.name:'—')}</span><span>🏢 ${esc(v.department||'—')}</span></div><div class="vacancy-stats"><div class="vacancy-stat"><div class="vacancy-stat-num">${cs.length}</div><div class="vacancy-stat-label">مرشح</div></div><div class="vacancy-stat"><div class="vacancy-stat-num" style="color:var(--success)">${cs.filter(c=>c.status==='accepted').length}</div><div class="vacancy-stat-label">مقبول</div></div></div></div>`;}).join('')}</div>`}</div>`;}

function openVacancyForm(id=null){const m=getCurrentManager();if(!canAddVacancy(m)){showToast('ليس لديك صلاحية','error');return;}const v=id?state.vacancies.find(x=>x.id===id):{title:'',department:'',management:'',openDate:new Date().toISOString().slice(0,10),status:'open',ownerId:m.id};const body=`<form id="vacancyForm"><div class="form-grid"><div class="form-group"><label>اسم الوظيفة <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" name="title" value="${esc(v.title)}" required></div><div class="form-group"><label>القسم</label><input type="text" class="form-control" name="department" value="${esc(v.department||'')}"></div><div class="form-group"><label>الإدارة</label><input type="text" class="form-control" name="management" value="${esc(v.management||'')}"></div><div class="form-group"><label>تاريخ الفتح</label><input type="date" class="form-control" name="openDate" value="${v.openDate||''}"></div><div class="form-group"><label>الحالة</label><select class="form-control" name="status">${VACANCY_STATUSES.map(s=>`<option value="${s.key}" ${v.status===s.key?'selected':''}>${s.label}</option>`).join('')}</select></div><div class="form-group"><label>المسؤول</label><select class="form-control" name="ownerId" required>${state.managers.map(mg=>`<option value="${mg.id}" ${v.ownerId===mg.id?'selected':''}>${esc(mg.name)}</option>`).join('')}</select></div></div></form>`;openModal(id?'تعديل الشاغر':'➕ شاغر جديد',body,`<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" onclick="saveVacancy('${id||''}')">💾 حفظ</button>`);}

async function saveVacancy(id){const form=document.getElementById('vacancyForm');const data=Object.fromEntries(new FormData(form));if(!data.title.trim()){showToast('اسم الوظيفة مطلوب','error');return;}if(id){const v=state.vacancies.find(x=>x.id===id);if(v)Object.assign(v,data);showToast('تم التحديث');}else{state.vacancies.push({id:uid(),...data,createdAt:Date.now()});showToast('تمت الإضافة');}await saveAll();closeModal();render();}
async function deleteVacancy(id){if(!confirm('حذف الشاغر؟'))return;const v=state.vacancies.find(x=>x.id===id);if(v){v.isDeleted=true;v.deletedAt=Date.now();}await saveAll();showToast('تم الحذف');navTo('vacancies');}
async function closeVacancy(id){if(!confirm('إغلاق الشاغر؟'))return;const v=state.vacancies.find(x=>x.id===id);if(v)v.status='stopped';await saveAll();showToast('تم الإغلاق');render();}
async function reopenVacancy(id){if(!confirm('إعادة فتح؟'))return;const v=state.vacancies.find(x=>x.id===id);if(v)v.status='open';await saveAll();showToast('تم إعادة الفتح');render();}

function renderVacancyDetail(m){const v=state.vacancies.find(x=>x.id===state.currentVacancyId);if(!v||!canViewVacancy(m,v.id))return `<div class="card"><div class="empty-state"><div class="empty-state-title">غير مسموح</div></div></div>`;const cs=state.candidates.filter(c=>c.vacancyId===v.id);const o=getManager(v.ownerId);const ic=v.status==='stopped'||v.status==='filled';return `<div class="page-header"><div><button class="btn btn-secondary btn-sm mb-2" onclick="navTo('vacancies')">→ رجوع</button><h1 class="page-title">${esc(v.title)}</h1><p class="page-subtitle">👤 ${esc(o?o.name:'—')} • ${badge(v.status,VACANCY_STATUSES)}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" onclick="openVacancyForm('${v.id}')">✏️ تعديل</button>${ic?`<button class="btn btn-success" onclick="reopenVacancy('${v.id}')"> إعادة فتح</button>`:`<button class="btn btn-warning" onclick="closeVacancy('${v.id}')">🔒 إغلاق</button>`}<button class="btn btn-danger" onclick="deleteVacancy('${v.id}')">🗑️ حذف</button>${canAddCV(m)&&!ic?`<button class="btn btn-primary" onclick="openCandidateForm(null,'${v.id}')">➕ مرشح</button>`:''}</div></div><div class="stats-grid"><div class="stat-card"><div><div class="stat-label">إجمالي المرشحين</div><div class="stat-value">${cs.length}</div></div><div class="stat-icon"></div></div><div class="stat-card success"><div><div class="stat-label">المقبولون</div><div class="stat-value">${cs.filter(c=>c.status==='accepted').length}</div></div><div class="stat-icon">✅</div></div><div class="stat-card danger"><div><div class="stat-label">المرفوضون</div><div class="stat-value">${cs.filter(c=>c.status==='rejected').length}</div></div><div class="stat-icon">❌</div></div></div><div class="card"><div class="card-header"><div class="card-title">المرشحون (${cs.length})</div></div>${cs.length===0?`<div class="empty-state"><div class="empty-state-title">لا يوجد مرشحون</div></div>`:`<div class="table-wrapper"><table><thead><tr><th>الاسم</th><th>الجوال</th><th>البريد</th><th>التاريخ</th><th>الحالة</th>${canViewCV(m)?'<th>CV</th>':''}<th>إجراءات</th></tr></thead><tbody>${cs.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${fmtDate(c.createdAt)}</td><td>${badge(c.status,CANDIDATE_STATUSES)}</td>${canViewCV(m)?`<td>${c.cvData?`<button class="btn btn-secondary btn-sm" onclick="viewCV('${c.id}')">👁️</button>`:'—'}</td>`:''}<td><button class="btn btn-danger btn-sm" onclick="deleteCandidate('${c.id}')">🗑️</button></td></tr>`).join('')}</tbody></table></div>`}</div>`;}

function renderCandidates(m){const vc=getVisibleCandidates(m);const f=vc.filter(c=>{if(state.filters.status!=='all'&&c.status!==state.filters.status)return false;if(state.filters.vacancyId!=='all'&&c.vacancyId!==state.filters.vacancyId)return false;if(state.filters.search){const q=state.filters.search.toLowerCase();return (c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q);}return true;});return `<div class="page-header"><div><h1 class="page-title">المرشحون</h1><p class="page-subtitle">${f.length} مرشح</p></div>${canAddCV(m)?`<button class="btn btn-primary" onclick="openCandidateForm()">➕ مرشح</button>`:''}</div><div class="card"><div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap"><input type="text" class="form-control" id="candSearch" placeholder="🔍 بحث..." value="${esc(state.filters.search)}" style="flex:1;min-width:200px"><select class="form-control" id="vacancyFilter" style="max-width:250px"><option value="all">كل الشواغر</option>${getVisibleVacancies(m).map(v=>`<option value="${v.id}" ${state.filters.vacancyId===v.id?'selected':''}>${esc(v.title)}</option>`).join('')}</select><select class="form-control" id="statusFilter" style="max-width:200px"><option value="all">كل الحالات</option>${CANDIDATE_STATUSES.map(s=>`<option value="${s.key}" ${state.filters.status===s.key?'selected':''}>${s.label}</option>`).join('')}</select></div>${f.length===0?`<div class="empty-state"><div class="empty-state-title">لا توجد نتائج</div></div>`:`<div class="table-wrapper"><table><thead><tr><th>الاسم</th><th>الوظيفة</th><th>الجوال</th><th>الحالة</th>${canViewCV(m)?'<th>CV</th>':''}<th>إجراءات</th></tr></thead><tbody>${f.map(c=>{const v=state.vacancies.find(v=>v.id===c.vacancyId);return `<tr><td><strong>${esc(c.name)}</strong></td><td>${v?esc(v.title):'—'}</td><td>${esc(c.phone||'—')}</td><td><select class="form-control" style="padding:4px 8px;font-size:12px;min-width:130px" onchange="updateCandidateStatus('${c.id}',this.value)">${CANDIDATE_STATUSES.map(s=>`<option value="${s.key}" ${c.status===s.key?'selected':''}>${s.label}</option>`).join('')}</select></td>${canViewCV(m)?`<td>${c.cvData?`<button class="btn btn-secondary btn-sm" onclick="viewCV('${c.id}')">📄</button>`:'—'}</td>`:''}<td><div style="display:flex;gap:5px"><button class="btn btn-warning btn-sm" onclick="openQuickNotes('${c.id}')">📝</button><button class="btn btn-danger btn-sm" onclick="deleteCandidate('${c.id}')">🗑️</button></div></td></tr>`;}).join('')}</tbody></table></div>`}</div>`;}

let pendingCV=null;
function openCandidateForm(id=null,defaultVacancyId=null){const m=getCurrentManager();if(!canAddCV(m)){showToast('ليس لديك صلاحية','error');return;}const c=id?state.candidates.find(x=>x.id===id):{name:'',phone:'',email:'',vacancyId:defaultVacancyId||'',status:'new',notes:'',cvData:null,cvName:null};pendingCV=c.cvData?{data:c.cvData,name:c.cvName,type:c.cvType}:null;const vv=getVisibleVacancies(m);if(vv.length===0){showToast('لا توجد شواغر','error');return;}const body=`<form id="candidateForm"><div class="form-grid"><div class="form-group"><label>الاسم <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" name="name" value="${esc(c.name)}" required></div><div class="form-group"><label>الجوال</label><input type="tel" class="form-control" name="phone" value="${esc(c.phone||'')}"></div><div class="form-group"><label>البريد</label><input type="email" class="form-control" name="email" value="${esc(c.email||'')}"></div><div class="form-group"><label>الشاغر <span style="color:var(--danger)">*</span></label><select class="form-control" name="vacancyId" required><option value="">-- اختر --</option>${vv.map(v=>`<option value="${v.id}" ${c.vacancyId===v.id?'selected':''}>${esc(v.title)}</option>`).join('')}</select></div><div class="form-group"><label>الحالة</label><select class="form-control" name="status">${CANDIDATE_STATUSES.map(s=>`<option value="${s.key}" ${c.status===s.key?'selected':''}>${s.label}</option>`).join('')}</select></div></div><div class="form-group"><label>السيرة الذاتية</label><div style="border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;background:#fafbfc" onclick="document.getElementById('cvFile').click()"><div style="font-size:32px;opacity:.6">📄</div><div style="color:var(--text-light);font-size:13px">اضغط لاختيار ملف</div><input type="file" id="cvFile" accept=".pdf,.doc,.docx" style="display:none"></div><div id="fileInfo" style="display:${pendingCV?'flex':'none'};margin-top:8px;padding:8px;background:var(--primary-50);border-radius:6px;font-size:12px;align-items:center;gap:8px">📎 <span id="fileName">${esc(pendingCV?.name||'')}</span><button type="button" class="btn btn-sm btn-secondary" onclick="removeCV()">إزالة</button></div><div id="cvUploadStatus" class="cv-upload-status"></div></div><div class="form-group"><label>ملاحظات</label><textarea class="form-control" name="notes" rows="2">${esc(c.notes||'')}</textarea></div></form>`;openModal(id?'تعديل المرشح':'➕ مرشح جديد',body,`<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" onclick="saveCandidate('${id||''}')">💾 حفظ</button>`);document.getElementById('cvFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024){showToast('حجم الملف كبير (10MB)','error');return;}const r=new FileReader();r.onload=ev=>{pendingCV={data:ev.target.result,name:f.name,type:f.type};document.getElementById('fileInfo').style.display='flex';document.getElementById('fileName').textContent=f.name;};r.readAsDataURL(f);});}

function removeCV(){pendingCV=null;document.getElementById('cvFile').value='';document.getElementById('fileInfo').style.display='none';}

async function saveCandidate(id){const form=document.getElementById('candidateForm');const data=Object.fromEntries(new FormData(form));if(!data.name.trim()||!data.vacancyId){showToast('الاسم والشاغر مطلوبان','error');return;}const v=state.vacancies.find(x=>x.id===data.vacancyId);const statusEl=document.getElementById('cvUploadStatus');

if(id){const c=state.candidates.find(x=>x.id===id);Object.assign(c,data);if(v)c.vacancyTitle=v.title;
  if(pendingCV){if(statusEl){statusEl.className='cv-upload-status active';statusEl.textContent='⏳ جاري حفظ CV...';}
    const ok=await saveCV(c.id,pendingCV.data,pendingCV.name,pendingCV.type);
    if(ok){c.cvData=pendingCV.data;c.cvName=pendingCV.name;c.cvType=pendingCV.type;c.hasCV=true;if(statusEl){statusEl.className='cv-upload-status active success';statusEl.textContent='✅ تم حفظ CV في السحابة';}}
    else{if(statusEl){statusEl.className='cv-upload-status active error';statusEl.textContent='❌ فشل حفظ CV';}showToast('فشل حفظ CV','error');}}
  await updateCandidateOnly(c);showToast('تم التحديث');
}else{const newC={id:uid(),...data,vacancyTitle:v?v.title:'Unknown',cvData:null,cvName:null,cvType:null,hasCV:false,createdAt:Date.now()};
  if(pendingCV){if(statusEl){statusEl.className='cv-upload-status active';statusEl.textContent='⏳ جاري حفظ CV...';}
    const ok=await saveCV(newC.id,pendingCV.data,pendingCV.name,pendingCV.type);
    if(ok){newC.cvData=pendingCV.data;newC.cvName=pendingCV.name;newC.cvType=pendingCV.type;newC.hasCV=true;if(statusEl){statusEl.className='cv-upload-status active success';statusEl.textContent='✅ تم حفظ CV';}}
    else{if(statusEl){statusEl.className='cv-upload-status active error';statusEl.textContent='❌ فشل حفظ CV';}showToast('فشل حفظ CV','error');}}
  state.candidates.push(newC);await saveAll();showToast('تمت الإضافة');}
pendingCV=null;closeModal();render();}

async function deleteCandidate(id){if(!confirm('حذف المرشح؟'))return;state.candidates=state.candidates.filter(x=>x.id!==id);await deleteCV(id);await saveAll();showToast('تم الحذف');render();}

function openQuickNotes(id){const c=state.candidates.find(x=>x.id===id);if(!c)return;const body=`<div class="form-group"><label>ملاحظات: <strong style="color:var(--primary)">${esc(c.name)}</strong></label><textarea class="form-control" id="quickNoteText" rows="6">${esc(c.notes||'')}</textarea></div>`;openModal('📝 ملاحظات',body,`<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" onclick="saveQuickNote('${id}')">💾 حفظ</button>`);}
async function saveQuickNote(id){const c=state.candidates.find(x=>x.id===id);if(c){c.notes=document.getElementById('quickNoteText').value;await updateCandidateOnly(c);closeModal();render();showToast('تم الحفظ');}}
async function updateCandidateStatus(id,ns){const c=state.candidates.find(x=>x.id===id);if(c){c.status=ns;await updateCandidateOnly(c);showToast('تم التحديث');}}

function viewCV(id){const c=state.candidates.find(x=>x.id===id);if(!c||!c.cvData){showToast('لا يوجد ملف','error');return;}const isPdf=(c.cvType||'').includes('pdf')||(c.cvName||'').toLowerCase().endsWith('.pdf');const body=isPdf?`<iframe src="${c.cvData}" style="width:100%;height:70vh;border:none;border-radius:8px"></iframe>`:`<div style="text-align:center;padding:40px"><button class="btn btn-primary" onclick="downloadCV('${id}')">⬇️ تحميل</button></div>`;openModal(`📄 ${esc(c.cvName||'CV')}`,body,`<button class="btn btn-secondary" onclick="closeModal()">إغلاق</button><button class="btn btn-primary" onclick="downloadCV('${id}')">⬇️ تحميل</button>`,true);}
function downloadCV(id){const c=state.candidates.find(x=>x.id===id);if(!c||!c.cvData)return;const a=document.createElement('a');a.href=c.cvData;a.download=c.cvName||'cv.pdf';document.body.appendChild(a);a.click();document.body.removeChild(a);}

function renderInterviews(m){const vids=getVisibleVacancies(m).map(v=>v.id);const mi=state.interviews.filter(i=>vids.includes(i.vacancyId)).sort((a,b)=>new Date(a.date+'T'+a.time)-new Date(b.date+'T'+b.time));const up=mi.filter(i=>new Date(i.date)>=new Date(new Date().toDateString()));const pa=mi.filter(i=>new Date(i.date)<new Date(new Date().toDateString()));return `<div class="page-header"><div><h1 class="page-title">📅 المقابلات</h1><p class="page-subtitle">${mi.length} مقابلة (${up.length} قادمة)</p></div><button class="btn btn-primary" onclick="openInterviewForm()">➕ إنشاء مقابلة</button></div><div class="stats-grid"><div class="stat-card info"><div><div class="stat-label">قادمة</div><div class="stat-value">${up.length}</div></div><div class="stat-icon">📅</div></div><div class="stat-card"><div><div class="stat-label">سابقة</div><div class="stat-value">${pa.length}</div></div><div class="stat-icon">✅</div></div><div class="stat-card accent"><div><div class="stat-label">Google Meet</div><div class="stat-value">${mi.filter(i=>i.type==='google').length}</div></div><div class="stat-icon">📹</div></div><div class="stat-card warning"><div><div class="stat-label">مقر العمل</div><div class="stat-value">${mi.filter(i=>i.type==='office').length}</div></div><div class="stat-icon">🏢</div></div></div>${up.length>0?`<div class="card"><div class="card-header"><div class="card-title"> المقابلات القادمة</div></div><div class="table-wrapper"><table><thead><tr><th>المرشح</th><th>الوظيفة</th><th>النوع</th><th>التاريخ</th><th>الوقت</th><th>التفاصيل</th><th>إجراءات</th></tr></thead><tbody>${up.map(i=>{const c=state.candidates.find(x=>x.id===i.candidateId);const v=state.vacancies.find(x=>x.id===i.vacancyId);const ti=INTERVIEW_TYPES.find(t=>t.key===i.type);return `<tr><td><strong>${esc(c?c.name:'—')}</strong></td><td>${v?esc(v.title):'—'}</td><td><span class="badge ${ti?ti.class:''}">${ti?ti.icon+' '+ti.label:i.type}</span></td><td>${fmtDate(i.date)}</td><td>${i.time||'—'}</td><td>${i.type==='google'?(i.link?`<a href="${esc(i.link)}" target="_blank" style="color:var(--accent)">🔗 رابط</a>`:'—'):(i.location||'—')}</td><td><div style="display:flex;gap:5px">${i.link&&i.type==='google'?`<a href="${esc(i.link)}" target="_blank" class="btn btn-info btn-sm">📹 دخول</a>`:''}<button class="btn btn-secondary btn-sm" onclick="openInterviewForm('${i.id}')">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteInterview('${i.id}')">🗑️</button></div></td></tr>`;}).join('')}</tbody></table></div></div>`:'<div class="card"><div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-title">لا توجد مقابلات قادمة</div></div></div>'}${pa.length>0?`<div class="card"><div class="card-header"><div class="card-title">✅ المقابلات السابقة</div></div><div class="table-wrapper"><table><thead><tr><th>المرشح</th><th>الوظيفة</th><th>النوع</th><th>التاريخ</th><th>الوقت</th><th>إجراءات</th></tr></thead><tbody>${pa.map(i=>{const c=state.candidates.find(x=>x.id===i.candidateId);const v=state.vacancies.find(x=>x.id===i.vacancyId);const ti=INTERVIEW_TYPES.find(t=>t.key===i.type);return `<tr style="opacity:0.7"><td><strong>${esc(c?c.name:'—')}</strong></td><td>${v?esc(v.title):'—'}</td><td><span class="badge ${ti?ti.class:''}">${ti?ti.icon+' '+ti.label:i.type}</span></td><td>${fmtDate(i.date)}</td><td>${i.time||'—'}</td><td><div style="display:flex;gap:5px"><button class="btn btn-secondary btn-sm" onclick="openInterviewForm('${i.id}')">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteInterview('${i.id}')">🗑️</button></div></td></tr>`;}).join('')}</tbody></table></div></div>`:''}`;}

let selIntType=null;
function openInterviewForm(id=null){const m=getCurrentManager();const vv=getVisibleVacancies(m);const i=id?state.interviews.find(x=>x.id===id):{vacancyId:'',candidateId:'',type:'',date:'',time:'',link:'',location:'',notes:''};selIntType=i.type||null;const body=`<form id="interviewForm"><div class="form-group"><label>الشاغر الوظيفي</label><select class="form-control" id="intVacancySelect" onchange="updateCandidateList()"><option value="">-- اختر (اختياري) --</option>${vv.map(v=>`<option value="${v.id}" ${i.vacancyId===v.id?'selected':''}>${esc(v.title)}</option>`).join('')}</select></div><div class="form-group"><label>المرشح</label><select class="form-control" id="intCandidateSelect"><option value="">-- اختر (اختياري) --</option></select></div><div class="form-group"><label>نوع المقابلة</label><div class="interview-type-selector"><div class="interview-type-option ${selIntType==='google'?'selected':''}" onclick="selectInterviewType('google')"><div class="icon">📹</div><div class="label">Google Meet</div><div class="desc">عن بُعد</div></div><div class="interview-type-option ${selIntType==='office'?'selected':''}" onclick="selectInterviewType('office')"><div class="icon">🏢</div><div class="label">مقر العمل</div><div class="desc">حضورية</div></div></div><input type="hidden" name="type" id="intTypeInput" value="${i.type||''}"></div><div class="form-grid"><div class="form-group"><label>التاريخ</label><input type="date" class="form-control" name="date" value="${i.date||''}"></div><div class="form-group"><label>الوقت</label><input type="time" class="form-control" name="time" value="${i.time||''}"></div></div><div id="googleFields" style="display:${selIntType==='google'?'block':'none'}"><div class="form-group"><label>📹 رابط Google Meet</label><input type="url" class="form-control" name="link" value="${esc(i.link||'')}" placeholder="https://meet.google.com/..."></div></div><div id="officeFields" style="display:${selIntType==='office'?'block':'none'}"><div class="form-group"><label>🏢 الموقع</label><input type="text" class="form-control" name="location" value="${esc(i.location||'')}" placeholder="القاعة الرئيسية"></div></div><div class="form-group"><label>ملاحظات</label><textarea class="form-control" name="notes" rows="3" placeholder="أي ملاحظات إضافية...">${esc(i.notes||'')}</textarea></div></form>`;openModal(id?'✏️ تعديل المقابلة':'📅 إنشاء مقابلة جديدة',body,`<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" onclick="saveInterview('${id||''}')">💾 حفظ</button>`);if(i.vacancyId)setTimeout(()=>updateCandidateList(i.candidateId),100);}

function selectInterviewType(type){selIntType=type;document.getElementById('intTypeInput').value=type;document.querySelectorAll('.interview-type-option').forEach(el=>el.classList.remove('selected'));event.currentTarget.classList.add('selected');document.getElementById('googleFields').style.display=type==='google'?'block':'none';document.getElementById('officeFields').style.display=type==='office'?'block':'none';}

function updateCandidateList(selectedId=null){const vacancyId=document.getElementById('intVacancySelect').value;const cs=document.getElementById('intCandidateSelect');if(!vacancyId){cs.innerHTML='<option value="">-- اختر الشاغر أولاً --</option>';return;}const candidates=state.candidates.filter(c=>c.vacancyId===vacancyId);cs.innerHTML='<option value="">-- اختر (اختياري) --</option>'+candidates.map(c=>`<option value="${c.id}" ${selectedId===c.id?'selected':''}>${esc(c.name)} ${c.phone?'('+esc(c.phone)+')':''}</option>`).join('');}

async function saveInterview(id){const form=document.getElementById('interviewForm');const data=Object.fromEntries(new FormData(form));
  // ✅ كل الحقول اختيارية
  if(!data.vacancyId)data.vacancyId='';if(!data.candidateId)data.candidateId='';if(!data.type)data.type=selIntType||'';if(!data.date)data.date='';if(!data.time)data.time='';if(!data.link)data.link='';if(!data.location)data.location='';if(!data.notes)data.notes='';
  const candidate=state.candidates.find(c=>c.id===data.candidateId);
  if(id){const i=state.interviews.find(x=>x.id===id);if(i)Object.assign(i,data);showToast('تم تحديث المقابلة');}
  else{state.interviews.push({id:uid(),...data,createdAt:Date.now()});showToast('تم إنشاء المقابلة');}
  if(candidate){candidate.status='interview_scheduled';if(data.date)candidate.interviewDate=data.date;if(data.time)candidate.interviewTime=data.time;await updateCandidateOnly(candidate);}
  await saveAll();closeModal();render();}

async function deleteInterview(id){if(!confirm('حذف المقابلة؟'))return;state.interviews=state.interviews.filter(x=>x.id!==id);await saveAll();showToast('تم الحذف');render();}

function renderArchive(m){if(!canViewCV(m))return `<div class="card"><div class="empty-state"><div class="empty-state-title">ليس لديك صلاحية</div></div></div>`;const q=(state.filters.search||'').toLowerCase();const list=state.candidates.filter(c=>{if(!c.cvData)return false;if(q&&!(c.name||'').toLowerCase().includes(q))return false;const v=state.vacancies.find(x=>x.id===c.vacancyId);const isVisible=getVisibleVacancies(m).some(vac=>vac.id===c.vacancyId);const isDeletedAllowed=v&&v.isDeleted&&(isAdminAccount(m)||v.ownerId===m.id);return isVisible||isDeletedAllowed;});const folders={};list.forEach(c=>{const folderName=c.vacancyTitle||'غير مصنف';if(!folders[folderName])folders[folderName]=[];folders[folderName].push(c);});return `<div class="page-header"><div><h1 class="page-title">📁 أرشيف السير الذاتية</h1><p class="page-subtitle">${list.length} ملف</p></div></div><div class="card"><input type="text" class="form-control" id="archiveSearch" placeholder=" بحث..." value="${esc(state.filters.search)}" style="max-width:400px;margin-bottom:16px">${Object.keys(folders).length===0?`<div class="empty-state"><div class="empty-state-title">لا توجد ملفات</div></div>`:Object.entries(folders).map(([folderName,candidates])=>`<div style="margin-bottom:24px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px 14px;background:var(--primary-50);border-radius:8px;border-right:4px solid var(--accent)"><span style="font-size:20px">📁</span><strong style="color:var(--primary);font-size:15px">${esc(folderName)}</strong><span class="badge b-hiring" style="margin-right:auto">${candidates.length} CV</span></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">${candidates.map(c=>`<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px"><div style="display:flex;gap:12px;align-items:center;margin-bottom:12px"><div style="width:44px;height:44px;border-radius:50%;background:var(--gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">${initials(c.name)}</div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px;color:var(--primary)">${esc(c.name)}</div><div style="font-size:11px;color:var(--text-light)">${esc(c.cvName||'')} • ${fmtDate(c.createdAt)}</div></div></div><div style="display:flex;gap:6px"><button class="btn btn-primary btn-sm" style="flex:1" onclick="viewCV('${c.id}')">👁️ عرض</button><button class="btn btn-secondary btn-sm" style="flex:1" onclick="downloadCV('${c.id}')">⬇️ تحميل</button></div></div>`).join('')}</div></div>`).join('')}</div>`;}

function renderCVRequest(m){const visibleV=getVisibleVacancies(m);return `<div class="page-header"><div><h1 class="page-title">📤 طلب السير الذاتية</h1></div></div><div style="background:var(--gradient);color:#fff;padding:22px;border-radius:14px;margin-bottom:20px"><select id="cvRequestSelect" onchange="updateCVRequest()" style="width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:600;background:rgba(255,255,255,.95);color:var(--primary);cursor:pointer"><option value="">-- اختر الشاغر --</option>${visibleV.map(v=>{const count=state.candidates.filter(c=>c.vacancyId===v.id&&c.cvData).length;return `<option value="${v.id}">${esc(v.title)} (${count} CV)</option>`}).join('')}</select></div><div id="cvRequestResult"></div>`;}

function updateCVRequest(){const vid=document.getElementById('cvRequestSelect').value;const container=document.getElementById('cvRequestResult');if(!vid){container.innerHTML='';return;}const v=state.vacancies.find(x=>x.id===vid);const cs=state.candidates.filter(c=>c.vacancyId===vid&&c.cvData);if(cs.length===0){container.innerHTML=`<div class="card"><div class="empty-state"><div class="empty-state-title">لا توجد ملفات</div></div></div>`;return;}container.innerHTML=`<div class="card"><div class="card-header"><div class="card-title">${esc(v.title)}</div><div style="display:flex;gap:6px"><button class="btn btn-primary btn-sm" onclick="viewAllCVs('${vid}')">👁️ عرض الكل</button><button class="btn btn-accent btn-sm" onclick="downloadAllCVs('${vid}')">️ ZIP</button></div></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">${cs.map(c=>`<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px"><div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><div style="width:38px;height:38px;border-radius:50%;background:var(--gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">${initials(c.name)}</div><div style="flex:1"><div style="font-weight:700;font-size:13px;color:var(--primary)">${esc(c.name)}</div></div></div><div style="display:flex;gap:6px"><button class="btn btn-primary btn-sm" style="flex:1" onclick="viewCV('${c.id}')">👁️ عرض</button><button class="btn btn-secondary btn-sm" onclick="downloadCV('${c.id}')">⬇️</button></div></div>`).join('')}</div></div>`;}

async function downloadAllCVs(vid){const v=state.vacancies.find(x=>x.id===vid);const cs=state.candidates.filter(c=>c.vacancyId===vid&&c.cvData);if(cs.length===0||typeof JSZip==='undefined')return;showToast('جاري التجهيز...');const zip=new JSZip();const folder=zip.folder((v.title||'CVs').replace(/[^\w\u0600-\u06FF]/g,'_'));cs.forEach((c,i)=>{const ext=(c.cvName||'cv.pdf').split('.').pop();folder.file(`${i+1}_${c.name.replace(/[^\w\u0600-\u06FF]/g,'_')}.${ext}`,c.cvData.split(',')[1],{base64:true});});const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${v.title}_CVs.zip`;a.click();showToast('تم التحميل');}

function viewAllCVs(vid){const cs=state.candidates.filter(c=>c.vacancyId===vid&&c.cvData);if(cs.length===0)return;const body=cs.map((c,i)=>`<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong>${i+1}. ${esc(c.name)}</strong><button class="btn btn-secondary btn-sm" onclick="downloadCV('${c.id}')">️</button></div><iframe src="${c.cvData}" style="width:100%;height:400px;border:1px solid var(--border);border-radius:8px"></iframe></div>`).join('');openModal(`📄 (${cs.length})`,body,`<button class="btn btn-secondary" onclick="closeModal()">إغلاق</button>`,true);}

function renderSettings(m){if(!isAdminAccount(m))return `<div class="card"><div class="empty-state"><div class="empty-state-icon">🔒</div><div class="empty-state-title">متاح لـ admin فقط</div></div></div>`;return `<div class="page-header"><div><h1 class="page-title">⚙️ إدارة المستخدمين</h1></div></div><div style="background:#d1fae5;border:1px solid #10b981;color:#065f46;padding:12px;border-radius:8px;font-size:13px;margin-bottom:18px">✅ Firebase Cloud - CVs محفوظة في عقد منفصلة<div style="margin-top:6px;font-size:12px">آخر تحديث: <strong>${state.lastSaved?fmtDateTime(state.lastSaved):'—'}</strong></div></div><div class="card"><div class="card-header"><div class="card-title">👥 المستخدمون (${state.managers.length})</div><button class="btn btn-primary btn-sm" onclick="openManagerForm()">➕ إضافة مستخدم</button></div><div class="table-wrapper"><table><thead><tr><th>الاسم</th><th>المستخدم</th><th>الدور</th><th>إجراءات</th></tr></thead><tbody>${state.managers.map(mgr=>{const isProtected=isAdminAccount(mgr);return `<tr style="${isProtected?'background:var(--primary-50)':''}"><td><strong>${esc(mgr.name)} ${mgr.id===m.id?'<span style="font-size:10px;color:var(--accent)">(أنت)</span>':''}</strong></td><td><code style="background:var(--primary-50);padding:2px 8px;border-radius:4px;font-size:12px">@${esc(mgr.username)}</code></td><td>${isAdminAccount(mgr)?'<span class="badge b-hiring">مدير نظام</span>':esc(mgr.role||'مدير')}</td><td><div style="display:flex;gap:5px">${isProtected?`<button class="btn btn-secondary btn-sm" disabled style="opacity:0.5">🔒 محمي</button>`:`<button class="btn btn-secondary btn-sm" onclick="openManagerForm('${mgr.id}')">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteManager('${mgr.id}')">🗑️</button>`}</div></td></tr>`;}).join('')}</tbody></table></div></div><div class="card"><div class="card-title mb-3">💾 النسخ الاحتياطي</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="exportBackup()">📤 تصدير</button><button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 استيراد</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)"><button class="btn btn-danger" onclick="clearAllData()">🗑️ حذف الكل</button></div></div>`;}

function openManagerForm(id=null){const mgr=id?state.managers.find(x=>x.id===id):{name:'',role:'manager',username:'',password:'',permissions:{canViewAllVacancies:false,canAddVacancy:false,canViewCV:false,canAddCV:false,allowedVacancyIds:[]}};if(id&&isAdminAccount(mgr)){showToast('لا يمكن تعديل admin','error');return;}const body=`<form id="managerForm"><div class="form-grid"><div class="form-group"><label>الاسم <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" name="name" value="${esc(mgr.name)}" required></div><div class="form-group"><label>المستخدم <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" name="username" value="${esc(mgr.username||'')}" required ${id?'readonly style="background:#f0f2f7"':''}></div><div class="form-group"><label>كلمة المرور <span style="color:var(--danger)">*</span></label><input type="text" class="form-control" name="password" value="${esc(mgr.password||'123456')}" required></div><div class="form-group"><label>الدور</label><select class="form-control" name="role"><option value="manager" ${mgr.role==='manager'?'selected':''}>مدير عادي</option><option value="admin" ${mgr.role==='admin'?'selected':''}>مدير النظام</option></select></div></div><hr style="margin:16px 0;border:none;border-top:1px solid var(--border)"><h4 style="margin-bottom:12px;color:var(--primary)">⚙️ الصلاحيات</h4><div class="permissions-grid"><label class="permission-item"><input type="checkbox" name="canViewAllVacancies" ${mgr.permissions.canViewAllVacancies?'checked':''}> رؤية كل الشواغر</label><label class="permission-item"><input type="checkbox" name="canAddVacancy" ${mgr.permissions.canAddVacancy?'checked':''}> إضافة شواغر</label><label class="permission-item"><input type="checkbox" name="canViewCV" ${mgr.permissions.canViewCV?'checked':''}> عرض CVs</label><label class="permission-item"><input type="checkbox" name="canAddCV" ${mgr.permissions.canAddCV?'checked':''}> إضافة مرشحين</label></div></form>`;openModal(id?'️ تعديل':'➕ مستخدم جديد',body,`<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" onclick="saveManager('${id||''}')">💾 حفظ</button>`);}

async function saveManager(id){const form=document.getElementById('managerForm');const data=Object.fromEntries(new FormData(form));if(!data.name.trim()||!data.username.trim()||!data.password.trim()){showToast('البيانات مطلوبة','error');return;}if(data.username.toLowerCase()===ADMIN_USERNAME&&(!id||id!==state.managers.find(m=>m.username===ADMIN_USERNAME)?.id)){showToast('admin محجوز','error');return;}const newPerms={canViewAllVacancies:data.canViewAllVacancies==='on',canAddVacancy:data.canAddVacancy==='on',canViewCV:data.canViewCV==='on',canAddCV:data.canAddCV==='on',allowedVacancyIds:[]};if(id){const mgr=state.managers.find(x=>x.id===id);mgr.name=data.name;mgr.username=data.username;mgr.password=data.password;mgr.role=data.role;mgr.permissions=newPerms;showToast('تم التحديث');}else{if(state.managers.some(m=>m.username.toLowerCase()===data.username.toLowerCase())){showToast('المستخدم موجود','error');return;}state.managers.push({id:uid(),name:data.name,username:data.username,password:data.password,role:data.role,permissions:newPerms});showToast('تمت الإضافة');}await saveAll();closeModal();render();}

async function deleteManager(id){const mgr=state.managers.find(x=>x.id===id);if(!mgr||isAdminAccount(mgr)){showToast('لا يمكن الحذف','error');return;}if(!confirm('حذف المستخدم؟'))return;state.managers=state.managers.filter(x=>x.id!==id);await saveAll();showToast('تم الحذف');render();}

function exportBackup(){const data={managers:state.managers,vacancies:state.vacancies,candidates:state.candidates,interviews:state.interviews,language:state.language,exportDate:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`avnzor_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();showToast('تم التصدير (يشمل CVs)');}

async function importBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{try{const data=JSON.parse(ev.target.result);if(!confirm('سيتم استبدال جميع البيانات. متابعة؟'))return;showToast('⏳ جاري استيراد البيانات...');state.managers=data.managers||[];state.vacancies=data.vacancies||[];state.candidates=data.candidates||[];state.interviews=data.interviews||[];if(data.language)state.language=data.language;if(!state.managers.some(m=>m.username===ADMIN_USERNAME)){state.managers.unshift({id:uid(),name:'مدير النظام',username:ADMIN_USERNAME,password:ADMIN_PASSWORD,role:'admin',permissions:{canViewAllVacancies:true,canAddVacancy:true,canViewCV:true,canAddCV:true,allowedVacancyIds:[]}});}
  // ✅ رفع كل CV إلى المسار المنفصل
  let cvCount=0;
  for(const c of state.candidates){
    if(c.cvData&&c.cvData.length>100){
      try{await saveCV(c.id,c.cvData,c.cvName,c.cvType);c.hasCV=true;cvCount++;}
      catch(err){console.warn('فشل رفع CV لـ',c.name,err);}
    }
  }
  await saveAll();
  showToast(`✅ تم الاستيراد بنجاح! (${cvCount} CV رُفعت للسحابة)`);
  render();
}catch(err){console.error(err);showToast('ملف غير صالح: '+err.message,'error');}};r.readAsText(f);}

async function clearAllData(){if(!confirm('⚠️ حذف جميع البيانات؟'))return;if(!confirm('تأكيد أخير؟'))return;state.vacancies=[];state.candidates=[];state.interviews=[];state.managers=[{id:uid(),name:'مدير النظام',username:ADMIN_USERNAME,password:ADMIN_PASSWORD,role:'admin',permissions:{canViewAllVacancies:true,canAddVacancy:true,canViewCV:true,canAddCV:true,allowedVacancyIds:[]}}];state.currentManagerId=state.managers[0].id;await saveAll();render();showToast('تم الحذف');}

function setLanguage(lang){state.language=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));saveAll();if(state.currentManagerId&&getCurrentManager())render();showToast('تم تغيير اللغة');}

function attachPageEvents(){const vs=document.getElementById('vacancySearch');if(vs)vs.addEventListener('input',e=>{state.filters.search=e.target.value;render();});const cs=document.getElementById('candSearch');if(cs)cs.addEventListener('input',e=>{state.filters.search=e.target.value;render();});const vf=document.getElementById('vacancyFilter');if(vf)vf.addEventListener('change',e=>{state.filters.vacancyId=e.target.value;render();});const sf=document.getElementById('statusFilter');if(sf)sf.addEventListener('change',e=>{state.filters.status=e.target.value;render();});const as=document.getElementById('archiveSearch');if(as)as.addEventListener('input',e=>{state.filters.search=e.target.value;render();});}

(async()=>{await initFirebase();loadSession();if(state.currentManagerId&&getManager(state.currentManagerId)){showApp();}else{document.getElementById('loginPage').style.display='flex';}if(window.innerWidth<=900){document.getElementById('menuToggle').style.display='inline-flex';}window.addEventListener('resize',()=>{document.getElementById('menuToggle').style.display=window.innerWidth<=900?'inline-flex':'none';})();
</script>
</body>
</html>
