<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أقنزور - نظام إدارة التوظيف</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --primary:#0d1b4c;--primary-dark:#081038;--primary-light:#1a2d6d;
  --primary-50:#e8ecf7;--primary-100:#d0d8ef;
  --accent:#4a6cf7;--accent-light:#6b8cff;--accent-dark:#3451c7;
  --gold:#f59e0b;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#06b6d4;
  --bg:#f0f2f7;--card:#ffffff;--text:#0d1b4c;--text-light:#5a6580;--text-lighter:#8892a8;
  --border:#e2e6ef;--border-light:#f0f2f7;
  --shadow:0 1px 3px rgba(13,27,76,.06),0 1px 2px rgba(13,27,76,.04);
  --shadow-md:0 4px 6px -1px rgba(13,27,76,.08);
  --shadow-lg:0 10px 25px -5px rgba(13,27,76,.12);
  --radius:10px;--sidebar-w:260px;
  --gradient:linear-gradient(135deg,#0d1b4c 0%,#1a2d6d 100%);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#f0f2f7}::-webkit-scrollbar-thumb{background:#c5cbe0;border-radius:4px}

[dir="ltr"] .sidebar { right: auto; left: 0; border-left: none; border-right: 1px solid var(--border); }
[dir="ltr"] .main { margin-right: 0 !important; margin-left: var(--sidebar-w); }
[dir="ltr"] .nav-link { border-right: none; border-left: 3px solid transparent; }
[dir="ltr"] .nav-link.active { border-right-color: transparent; border-left-color: var(--accent); }
[dir="ltr"] .stat-card { border-right: none; border-left: 4px solid var(--primary); }
[dir="ltr"] th { text-align: left; }
[dir="ltr"] .user-info-text { text-align: left; }
[dir="ltr"] .vacancy-card::before { right: auto; left: 0; }
[dir="ltr"] .modal-footer { justify-content: flex-start; }
[dir="ltr"] .toast { left: auto; right: 20px; transform: translateX(120%); }
[dir="ltr"] .toast.show { transform: translateX(0); }
[dir="ltr"] .timeline-item::before { right: auto; left: -21px; }
[dir="ltr"] .timeline { padding-right: 0; padding-left: 24px; }
[dir="ltr"] .timeline::before { right: auto; left: 7px; }
[dir="ltr"] .info-item { border-right: none; border-left: 3px solid var(--accent); }
[dir="ltr"] .vacancy-owner { flex-direction: row-reverse; }

.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--gradient);padding:20px}
.login-box{background:#fff;border-radius:16px;padding:40px;max-width:420px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);position:relative}
.login-logo{text-align:center;margin-bottom:28px;padding-bottom:24px;border-bottom:2px solid var(--border-light)}
.login-logo svg{margin-bottom:12px}
.login-logo h1{font-size:22px;color:var(--primary);font-weight:800;margin-bottom:4px}
.login-title{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:20px;text-align:center}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--primary)}
.form-control{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;transition:all .2s;background:#fff;font-family:inherit}
.form-control:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,108,247,.12)}
.login-error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center;display:none}
.btn{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff;width:100%}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-accent{background:var(--accent);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-success{background:var(--success);color:#fff}

.app-container{display:none;min-height:100vh}
.app-container.active{display:flex}
.sidebar{width:var(--sidebar-w);background:#fff;min-height:100vh;position:fixed;right:0;top:0;border-left:1px solid var(--border);z-index:100;display:flex;flex-direction:column}
.logo{padding:18px 20px;background:var(--gradient);color:#fff;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--accent)}
.logo-svg{width:44px;height:44px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.logo-text h1{font-size:17px;font-weight:800;letter-spacing:.5px}
.logo-text p{font-size:11px;opacity:.85;margin-top:2px}
.nav-menu{list-style:none;padding:14px 10px;flex:1;overflow-y:auto}
.nav-item{margin-bottom:3px}
.nav-link{display:flex;align-items:center;gap:12px;padding:11px 14px;color:var(--text-light);text-decoration:none;border-radius:8px;transition:all .2s;cursor:pointer;font-size:14px;font-weight:500;border-right:3px solid transparent}
.nav-link:hover{background:var(--primary-50);color:var(--primary)}
.nav-link.active{background:var(--primary-50);color:var(--primary);border-right-color:var(--accent);font-weight:600}
.nav-icon{font-size:17px;width:22px;text-align:center}
.sidebar-footer{padding:12px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-lighter);text-align:center;background:var(--primary-50)}

.main{margin-right:var(--sidebar-w);flex:1;padding:20px 28px;width:calc(100% - var(--sidebar-w));min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.topbar-right{display:flex;gap:10px;align-items:center}
.topbar-left{display:flex;gap:10px;align-items:center}
.current-user{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border:1px solid var(--border);border-radius:10px;cursor:pointer}
.current-user:hover{border-color:var(--accent)}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.user-info-text{text-align:right}
.user-name{font-weight:700;font-size:13px;color:var(--primary)}
.user-role{font-size:11px;color:var(--text-light)}
.logout-btn{background:none;border:none;color:var(--danger);cursor:pointer;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px}
.logout-btn:hover{background:#fee2e2}

.lang-switch{display:flex;gap:3px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
.lang-btn{padding:6px 12px;border:none;background:none;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;color:var(--text-light);transition:all .2s;display:flex;align-items:center;gap:5px}
.lang-btn:hover{background:var(--primary-50);color:var(--primary)}
.lang-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(74,108,247,.3)}

.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:700;color:var(--primary)}
.page-subtitle{color:var(--text-light);font-size:13px;margin-top:4px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--card);padding:18px;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;border-right:4px solid var(--primary);transition:all .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card.accent{border-color:var(--accent)}.stat-card.success{border-color:var(--success)}.stat-card.warning{border-color:var(--warning)}.stat-card.info{border-color:var(--info)}.stat-card.danger{border-color:var(--danger)}
.stat-label{color:var(--text-light);font-size:12px;margin-bottom:5px;font-weight:500}
.stat-value{font-size:26px;font-weight:700;color:var(--primary)}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--primary-50);color:var(--primary)}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.card-title{font-size:16px;font-weight:700;color:var(--primary)}

.vacancies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.vacancy-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;border:1px solid var(--border);position:relative;overflow:hidden}
.vacancy-card::before{content:"";position:absolute;top:0;right:0;width:100%;height:4px;background:var(--gradient)}
.vacancy-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.vacancy-title{font-size:16px;font-weight:700;margin-bottom:6px;margin-top:4px;color:var(--primary)}
.vacancy-meta-row{display:flex;gap:12px;color:var(--text-light);font-size:12px;margin-bottom:10px;flex-wrap:wrap}
.vacancy-owner{background:var(--primary-50);padding:6px 10px;border-radius:6px;font-size:11px;color:var(--primary);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}

.modal-overlay{position:fixed;inset:0;background:rgba(13,27,76,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(3px)}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:hidden;box-shadow:0 25px 50px rgba(13,27,76,.25);display:flex;flex-direction:column}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--gradient);color:#fff}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#fff}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--primary-50)}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-light)}

@media(max-width:900px){
  .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-right:0 !important;margin-left:0 !important;width:100%;padding:14px}
}
</style>
</head>
<body>

<div class="login-page" id="loginPage">
  <div class="login-box">
    <div style="position:absolute;top:14px;left:14px">
      <div class="lang-switch">
        <button class="lang-btn active" onclick="setLanguage('ar')">🇸🇦 عربي</button>
        <button class="lang-btn" onclick="setLanguage('en')">🇬🇧 EN</button>
      </div>
    </div>
    <div class="login-logo">
      <svg width="80" height="80" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#0d1b4c" rx="12"/>
        <text x="50" y="48" font-family="Arial" font-size="22" font-weight="bold" fill="white" text-anchor="middle">أقنزور</text>
        <text x="50" y="72" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">avnzor</text>
      </svg>
      <h1>أقنزور | avnzor</h1>
    </div>
    <div class="login-title">تسجيل الدخول للنظام</div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" class="form-control" id="loginUsername" required placeholder="أدخل اسم المستخدم">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" class="form-control" id="loginPassword" required placeholder="أدخل كلمة المرور">
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:10px">تسجيل الدخول</button>
    </form>
  </div>
</div>

<div class="app-container" id="appContainer">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-svg">
        <svg width="38" height="38" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" fill="#0d1b4c" rx="12"/>
          <text x="50" y="48" font-family="Arial" font-size="22" font-weight="bold" fill="white" text-anchor="middle">أقنزور</text>
          <text x="50" y="72" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">avnzor</text>
        </svg>
      </div>
      <div class="logo-text">
        <h1>أقنزور | avnzor</h1>
        <p>نظام إدارة التوظيف</p>
      </div>
    </div>
    <ul class="nav-menu">
      <li class="nav-item"><a class="nav-link active"><span class="nav-icon">📊</span><span>لوحة التحكم</span></a></li>
      <li class="nav-item"><a class="nav-link"><span class="nav-icon">💼</span><span>الشواغر الوظيفية</span></a></li>
      <li class="nav-item"><a class="nav-link"><span class="nav-icon">👥</span><span>المرشحون</span></a></li>
    </ul>
    <div class="sidebar-footer">أقنزور v6.1 © 2026 - نظام دائم</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-right">
        <div class="current-user">
          <div class="user-avatar">ر</div>
          <div class="user-info-text">
            <div class="user-name">ريان</div>
            <div class="user-role">مدير التوظيف</div>
          </div>
          <button class="logout-btn" onclick="logout()" title="تسجيل خروج">🚪</button>
        </div>
      </div>
      <div class="topbar-left">
        <div class="lang-switch">
          <button class="lang-btn active" onclick="setLanguage('ar')">🇸🇦 عربي</button>
          <button class="lang-btn" onclick="setLanguage('en')">🇬🇧 EN</button>
        </div>
      </div>
    </div>
    <div id="app"></div>
  </main>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle"></h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- FIREBASE WITH PERSISTENCE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = { projectId: "avnzorjoop" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // تفعيل التخزين الدائم المحلي
  enableIndexedDbPersistence(db).catch((err) => {
    console.log("Persistence status: ", err.code);
  });

  window.db = db;
  window.firestoreTools = { collection, addDoc, onSnapshot, serverTimestamp };

  const vacanciesRef = collection(db, "vacancies");
  onSnapshot(vacanciesRef, (snapshot) => {
    window.realtimeVacancies = [];
    snapshot.forEach(doc => window.realtimeVacancies.push({ id: doc.id, ...doc.data() }));
    if (window.renderVacanciesUI) window.renderVacanciesUI();
  });
</script>

<script>
// الحفاظ على حالة تسجيل الدخول الدائمة
document.addEventListener("DOMContentLoaded", () => {
  const isLoggedIn = localStorage.getItem('isLoggedIn');
  if (isLoggedIn === 'true') {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appContainer').classList.add('active');
    renderDashboard();
  }
});

function handleLogin(e) {
  e.preventDefault();
  localStorage.setItem('isLoggedIn', 'true');
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appContainer').classList.add('active');
  renderDashboard();
}

function logout() {
  localStorage.removeItem('isLoggedIn');
  document.getElementById('appContainer').classList.remove('active');
  document.getElementById('loginPage').style.display = 'flex';
}

function renderDashboard() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">مرحباً، ريان 👋</h1>
        <p class="page-subtitle">نظرة عامة دائمية ومحدثة لحظياً على النظام</p>
      </div>
      <button class="btn btn-accent" onclick="openAddVacancyModal()">➕ إضافة شاغر جديد</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card accent"><div class="stat-info"><div class="stat-label">الشواغر المتاحة</div><div class="stat-value" id="statVacanciesCount">0</div></div><div class="stat-icon">💼</div></div>
    </div>
    <div class="card">
      <div class="card-header"><h2 class="card-title">الشواغر الوظيفية الدائمة</h2></div>
      <div class="vacancies-grid" id="vacanciesListContainer">جاري التحميل...</div>
    </div>
  `;
  window.renderVacanciesUI();
}

window.renderVacanciesUI = function() {
  const container = document.getElementById('vacanciesListContainer');
  const countElem = document.getElementById('statVacanciesCount');
  if (!container) return;

  const data = window.realtimeVacancies || [];
  if (countElem) countElem.innerText = data.length;

  if (data.length === 0) {
    container.innerHTML = '<div class="empty-state">لا توجد شواغر حالياً</div>';
    return;
  }

  container.innerHTML = data.map(v => `
    <div class="vacancy-card">
      <div class="vacancy-title">${v.title || 'بدون عنوان'}</div>
      <div class="vacancy-meta-row"><span>🏢 ${v.department || 'عام'}</span></div>
      <div class="vacancy-owner">👤 المسؤول: ${v.owner || 'ريان'}</div>
    </div>
  `).join('');
};

function openAddVacancyModal() {
  document.getElementById('modalTitle').innerText = 'إضافة شاغر جديد';
  document.getElementById('modalBody').innerHTML = `
    <div class="form-group"><label>المسمى الوظيفي</label><input type="text" id="vTitle" class="form-control" placeholder="مثال: مدير تسويق"></div>
    <div class="form-group"><label>القسم</label><input type="text" id="vDept" class="form-control" placeholder="مثال: الموارد البشرية"></div>
  `;
  document.getElementById('modalFooter').innerHTML = `
    <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
    <button class="btn btn-primary" onclick="saveVacancyToFirebase()">نشر المباشر</button>
  `;
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

async function saveVacancyToFirebase() {
  const title = document.getElementById('vTitle').value;
  const dept = document.getElementById('vDept').value;
  if(!title) return alert('يرجى إدخال عنوان الشاغر');

  const { collection, addDoc, serverTimestamp } = window.firestoreTools;
  await addDoc(collection(window.db, "vacancies"), {
    title: title,
    department: dept,
    owner: "ريان",
    createdAt: serverTimestamp()
  });

  closeModal();
}

function setLanguage(lang) {
  document.dir = lang === 'ar' ? 'rtl' : 'ltr';
}
</script>
</body>
</html>
